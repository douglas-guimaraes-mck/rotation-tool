<html>

<head>

    <meta charset="UTF-8">

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

    <!-- JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.min.js"
        integrity="sha384-Atwg2Pkwv9vp0ygtn1JAojH0nYbwNJLPhwyoVbhoPwBhjQPR5VtM2+xf0Uwh9KtT"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>

    <script src="./Content/Js/Index.js"></script>
    <style>
        .active-context { box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.45); }
    </style>
</head>

<body onload="init()">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Rotation Tool</a>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">&nbsp;</div>
        <div class="row justify-content-center">
            <div class="col col-md-6">
                <div class="alert alert-primary">
                    Members
                </div>
                <button id="btnAlpha" onclick="btnAlpha_Click()" class="btn btn-outline-success" style="width: 100px;">&alpha;lpha</button>
                <button id="btnBeta" onclick="btnBeta_Click()" class="btn btn-outline-success" style="width: 100px;">&beta;eta</button>
                <button id="btnAll" onclick="btnAll_Click()" class="btn btn-outline-primary" style="width: 100px;">All</button>
                <button id="btnSupportChampion" onclick="btnSupportChampion_Click()" class="btn btn-outline-warning" style="width: 140px;">Support Champ</button>
                <!-- <button id="btnOnlyDevs" onclick="btnOnlyDevs_Click()" class="btn btn-outline-dark" style="width: 100px;">Devs</button> -->
                <!-- <button id="btnOnlyNonDevs" onclick="btnOnlyNonDevs_Click()" class="btn btn-outline-secondary" style="width: 100px;">Non-Devs</button> -->
                <hr>
                <div id="facilitatorsList" class="row" style="padding: 5px;">

                </div>
                <hr>
                <div id="statusPanel" class="card mb-3">
                    <div class="card-body py-2 px-3" style="font-size: 0.85rem;">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span><strong>Context:</strong> <span id="historyContextLabel">&mdash;</span></span>
                            <span class="text-nowrap">
                                <button id="clearHistoryBtn" class="btn btn-link btn-sm py-0" onclick="clearCurrentHistory()" style="display:none;">Clear history</button>
                                <button class="btn btn-link btn-sm py-0" onclick="copyShareLink()">Share link</button>
                            </span>
                        </div>
                        <div class="mb-1"><strong>Selected:</strong> <span id="selectedDisplay" class="text-muted">none</span></div>
                        <div><strong id="historyLabel">Already picked:</strong> <span id="historyList" class="text-muted">&mdash;</span></div>
                    </div>
                </div>
                <div id="manualChampPanel" style="display:none;" class="mb-3">
                    <div class="row g-2">
                        <div class="col">
                            <label for="selManualPrimary" class="form-label mb-1" style="font-size: 0.8rem;">Primary (manual)</label>
                            <select id="selManualPrimary" class="form-select form-select-sm">
                                <option value="">Auto</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="selManualSecondary" class="form-label mb-1" style="font-size: 0.8rem;">Secondary (manual)</label>
                            <select id="selManualSecondary" class="form-select form-select-sm">
                                <option value="">Auto</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="text-end mb-4">
                    <button id="btnDefineFacilitator" class="btn btn-outline-success" type="button" onclick="btnDefineFacilitator_Click()" style="width: 100px;">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" id="spinner" style="display: none;"  ></span>
                        Define
                    </button>
                </div>
                
            </div>
        </div>
    </div>
</body>

</html>
